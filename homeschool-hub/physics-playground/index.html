<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renaissance Kids: Physics Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rkOrange: '#F05A22',
                        rkSunYellow: '#FBC440',
                        rkSkin: '#F7C4A5',
                        rkRed: '#E92929',
                        rkGreen: '#48B749',
                        rkBlue: '#2B59C3',
                        rkYellow: '#FFE600',
                        rkPurple: '#8028A0',
                        rkStaff: '#B2DCE3',
                        rkLines: '#2F6B65'
                    },
                    fontFamily: {
                        'kids': ['"Fredoka"', 'sans-serif'],
                        'renaissance': ['"Georgia"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        * { font-family: 'Fredoka', sans-serif; touch-action: manipulation; }
        .font-serif-header { font-family: 'Georgia', serif; letter-spacing: 1px; }
        body {
            background: linear-gradient(145deg, #B2DCE3 0%, #e0f2f5 100%);
            background-attachment: fixed;
            overflow: hidden; /* Prevent scrolling when playing with canvas */
        }
        canvas {
            touch-action: none; /* Prevent browser handling of touch on canvas */
        }
        .btn-lab {
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .btn-lab:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .active-lab {
            background-color: #2F6B65; /* rkLines */
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(47, 107, 101, 0.5);
        }
    </style>
</head>
<body class="h-screen flex flex-col p-2 md:p-4">

    <!-- Header -->
    <header class="text-center mb-4 bg-white/95 backdrop-blur-sm p-3 rounded-2xl shadow-md border-4 border-rkOrange flex-none">
        <h1 class="text-2xl md:text-3xl font-black text-rkOrange drop-shadow-sm font-serif-header">
            <span class="text-black">Renaissance</span> Kids
        </h1>
        <h2 class="text-lg md:text-xl font-black text-rkBlue uppercase tracking-wider">
            <i class="fas fa-atom text-rkSunYellow mr-2"></i> Ultimate Physics Playground <i class="fas fa-atom text-rkSunYellow ml-2"></i>
        </h2>
    </header>

    <!-- Lab Controls -->
    <nav class="flex overflow-x-auto justify-start md:justify-center gap-2 mb-4 pb-2 snap-x flex-none w-full" id="lab-nav">
        <!-- Buttons generated by JS -->
    </nav>

    <!-- Interactive Canvas Area -->
    <main class="flex-grow w-full bg-white rounded-3xl shadow-inner border-4 border-gray-300 relative overflow-hidden flex flex-col">
        
        <!-- Instructional Overlay -->
        <div id="instruction-bar" class="absolute top-0 left-0 w-full bg-black/60 text-white p-2 text-center font-bold z-10 backdrop-blur-sm text-sm md:text-base transition-colors duration-300">
            Select a lab station above to begin!
        </div>

        <!-- The Canvas -->
        <canvas id="physicsCanvas" class="w-full h-full block cursor-crosshair"></canvas>
        
        <!-- Lab Specific Context Controls (Hidden by default) -->
        <div id="context-controls" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex gap-4 z-10 hidden bg-white/80 p-2 rounded-full border-2 border-gray-400 backdrop-blur-md">
            <!-- Dynamic Buttons Go Here -->
        </div>

    </main>

    <script>
        // --- Canvas Setup ---
        const canvas = document.getElementById('physicsCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            // Get bounding rect of the parent main tag to fill exactly
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            width = canvas.width;
            height = canvas.height;
        }
        window.addEventListener('resize', resizeCanvas);
        
        // --- Input Handling ---
        const mouse = { x: 0, y: 0, isDown: false };
        
        function updateMouse(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            mouse.x = clientX - rect.left;
            mouse.y = clientY - rect.top;
        }

        canvas.addEventListener('mousedown', (e) => { mouse.isDown = true; updateMouse(e); handleAction('down'); });
        canvas.addEventListener('mousemove', (e) => { updateMouse(e); handleAction('move'); });
        canvas.addEventListener('mouseup', () => { mouse.isDown = false; handleAction('up'); });
        
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); mouse.isDown = true; updateMouse(e); handleAction('down'); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updateMouse(e); handleAction('move'); }, {passive: false});
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); mouse.isDown = false; handleAction('up'); }, {passive: false});

        // --- Brand Colors ---
        const colors = {
            orange: '#F05A22', yellow: '#FBC440', red: '#E92929', 
            green: '#48B749', blue: '#2B59C3', purple: '#8028A0'
        };

        // --- Labs Architecture ---
        let currentLab = 'light';
        let animationFrameId;
        
        const labs = {
            light: { title: "Light (Wave/Particle)", icon: "fa-lightbulb", color: "bg-rkOrange", border: "border-rkOrange", text: "text-rkOrange" },
            sound: { title: "Sound Waves", icon: "fa-volume-up", color: "bg-rkBlue", border: "border-rkBlue", text: "text-rkBlue" },
            magnet: { title: "Electromagnetism", icon: "fa-magnet", color: "bg-rkPurple", border: "border-rkPurple", text: "text-rkPurple" },
            friction: { title: "Friction", icon: "fa-shoe-prints", color: "bg-rkRed", border: "border-rkRed", text: "text-rkRed" },
            centrifugal: { title: "Centrifugal Spin", icon: "fa-sync", color: "bg-rkGreen", border: "border-rkGreen", text: "text-rkGreen" },
            gravity: { title: "Gravity Drops", icon: "fa-apple-alt", color: "bg-rkLines", border: "border-gray-600", text: "text-gray-700" }
        };

        // UI Setup
        const nav = document.getElementById('lab-nav');
        for (const [key, lab] of Object.entries(labs)) {
            const btn = document.createElement('button');
            btn.className = `btn-lab snap-center flex-none bg-white font-black py-2 px-3 rounded-xl border-4 ${lab.border} ${lab.text} text-xs md:text-sm flex items-center gap-2`;
            btn.innerHTML = `<i class="fas ${lab.icon}"></i> ${lab.title}`;
            btn.onclick = () => setLab(key);
            btn.id = `nav-${key}`;
            nav.appendChild(btn);
        }

        const instructionBar = document.getElementById('instruction-bar');
        const contextControls = document.getElementById('context-controls');

        function setLab(key) {
            currentLab = key;
            // Update buttons
            document.querySelectorAll('.btn-lab').forEach(b => {
                b.classList.remove('active-lab');
                b.style.backgroundColor = 'white';
                // Restore text color based on ID
                const labKey = b.id.replace('nav-', '');
                b.classList.add(labs[labKey].text);
            });
            const activeBtn = document.getElementById(`nav-${key}`);
            activeBtn.classList.add('active-lab');
            activeBtn.classList.remove(labs[key].text); // Remove colored text so it becomes white
            
            // Clear entities
            entities = [];
            
            // Setup specific lab
            contextControls.innerHTML = '';
            contextControls.classList.add('hidden');
            
            if(key === 'light') {
                instructionBar.innerText = "Click to turn on the flashlight! Toggle modes below.";
                instructionBar.style.backgroundColor = colors.orange;
                setupLightContext();
            } else if(key === 'sound') {
                instructionBar.innerText = "Click anywhere to bang the drum and see sound waves!";
                instructionBar.style.backgroundColor = colors.blue;
            } else if(key === 'magnet') {
                instructionBar.innerText = "Drag the powerful magnet around to attract the loose metal particles!";
                instructionBar.style.backgroundColor = colors.purple;
                initMagnetParticles();
            } else if(key === 'friction') {
                instructionBar.innerText = "Pull the block back like a slingshot and let go! Change the floor type below.";
                instructionBar.style.backgroundColor = colors.red;
                setupFrictionContext();
            } else if(key === 'centrifugal') {
                instructionBar.innerText = "Click and hold to spin the ball. Let go to see Centrifugal Force fly it away!";
                instructionBar.style.backgroundColor = colors.green;
                initCentrifugal();
            } else if(key === 'gravity') {
                instructionBar.innerText = "Click around to drop bouncy balls and see gravity in action!";
                instructionBar.style.backgroundColor = '#2F6B65';
            }
        }

        // --- Global Entities Array ---
        let entities = [];

        // --- Action Dispatcher ---
        function handleAction(action) {
            if(currentLab === 'light') handleLight(action);
            if(currentLab === 'sound') handleSound(action);
            if(currentLab === 'magnet') handleMagnet(action);
            if(currentLab === 'friction') handleFriction(action);
            if(currentLab === 'centrifugal') handleCentrifugal(action);
            if(currentLab === 'gravity') handleGravity(action);
        }

        // ==========================================
        // LAB 1: LIGHT (Wave vs Particle)
        // ==========================================
        let lightMode = 'both'; // wave, particle, both
        let lightTimer = 0;
        function setupLightContext() {
            contextControls.classList.remove('hidden');
            const modes = ['wave', 'particle', 'both'];
            modes.forEach(mode => {
                const b = document.createElement('button');
                b.className = `px-4 py-1 rounded-full font-bold uppercase text-sm border-2 border-black ${lightMode===mode ? 'bg-rkYellow text-black' : 'bg-gray-200 text-gray-500'}`;
                b.innerText = mode;
                b.onclick = () => { lightMode = mode; setupLightContext(); };
                contextControls.appendChild(b);
            });
        }
        function handleLight(action) {
            // handled in loop
        }
        function drawLight() {
            if(!mouse.isDown) return;
            
            const dx = mouse.x - 0; // Flashlight at left middle
            const dy = mouse.y - height/2;
            const angle = Math.atan2(dy, dx);
            
            // Draw Flashlight
            ctx.save();
            ctx.translate(20, height/2);
            ctx.rotate(angle);
            ctx.fillStyle = '#333';
            ctx.fillRect(-20, -15, 40, 30);
            ctx.fillStyle = colors.yellow;
            ctx.fillRect(20, -10, 10, 20);
            ctx.restore();

            lightTimer += 0.2;

            ctx.save();
            ctx.translate(40, height/2);
            ctx.rotate(angle);

            // Draw Wave
            if(lightMode === 'wave' || lightMode === 'both') {
                ctx.beginPath();
                ctx.strokeStyle = colors.blue;
                ctx.lineWidth = 4;
                for(let i=0; i<width; i+=5) {
                    const waveY = Math.sin(i * 0.05 - lightTimer) * 30;
                    if(i===0) ctx.moveTo(i, waveY);
                    else ctx.lineTo(i, waveY);
                }
                ctx.stroke();
            }

            // Draw Particles (Photons)
            if(lightMode === 'particle' || lightMode === 'both') {
                if(Math.random() < 0.5) {
                    entities.push({
                        type: 'photon',
                        x: 0,
                        y: (Math.random() - 0.5) * 20,
                        vx: Math.cos(angle) * 15,
                        vy: Math.sin(angle) * 15,
                        life: 1.0,
                        color: Math.random() < 0.5 ? colors.yellow : colors.orange
                    });
                }
            }
            ctx.restore();

            // Update Photons
            for(let i = entities.length-1; i>=0; i--) {
                const p = entities[i];
                if(p.type === 'photon') {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.01;
                    
                    ctx.beginPath();
                    ctx.arc(p.x + 40, p.y + height/2, 6, 0, Math.PI*2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;

                    if(p.life <= 0 || p.x > width*2) entities.splice(i, 1);
                }
            }
        }

        // ==========================================
        // LAB 2: SOUND WAVES
        // ==========================================
        function handleSound(action) {
            if(action === 'down') {
                entities.push({ type: 'soundwave', x: mouse.x, y: mouse.y, radius: 10, alpha: 1.0 });
                // Add a little pop graphic
                entities.push({ type: 'pop', x: mouse.x, y: mouse.y, life: 1.0 });
            }
        }
        function drawSound() {
            for(let i = entities.length-1; i>=0; i--) {
                const e = entities[i];
                if(e.type === 'soundwave') {
                    e.radius += 5;
                    e.alpha -= 0.015;
                    if(e.alpha <= 0) { entities.splice(i, 1); continue; }
                    
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(43, 89, 195, ${e.alpha})`; // rkBlue
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    // Echo ring
                    if(e.radius > 50) {
                        ctx.beginPath();
                        ctx.arc(e.x, e.y, e.radius - 40, 0, Math.PI*2);
                        ctx.strokeStyle = `rgba(72, 183, 73, ${e.alpha * 0.5})`; // rkGreen
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                } else if(e.type === 'pop') {
                    e.life -= 0.05;
                    if(e.life <= 0) { entities.splice(i, 1); continue; }
                    ctx.fillStyle = `rgba(240, 90, 34, ${e.life})`; // rkOrange
                    ctx.font = "bold 24px Fredoka";
                    ctx.fillText("BANG!", e.x - 30, e.y - 10 + (1-e.life)*-20);
                }
            }
        }

        // ==========================================
        // LAB 3: ELECTROMAGNETISM
        // ==========================================
        function initMagnetParticles() {
            entities = []; // Reset
            for(let i=0; i<30; i++) {
                entities.push({
                    type: 'metal',
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: 0, vy: 0,
                    radius: 8
                });
            }
        }
        let magnetActive = false;
        function handleMagnet(action) {
            if(action === 'down') magnetActive = true;
            if(action === 'up') magnetActive = false;
        }
        function drawMagnet() {
            // Draw Magnet
            if(magnetActive) {
                ctx.save();
                ctx.translate(mouse.x, mouse.y);
                // Draw U shape
                ctx.beginPath();
                ctx.arc(0, 0, 30, Math.PI, 0);
                ctx.lineTo(30, -30); ctx.lineTo(10, -30); ctx.lineTo(10, 0);
                ctx.arc(0, 0, 10, 0, Math.PI, true);
                ctx.lineTo(-10, -30); ctx.lineTo(-30, -30); ctx.closePath();
                ctx.fillStyle = colors.red;
                ctx.fill();
                ctx.stroke();
                // Magnet Poles
                ctx.fillStyle = '#ccc';
                ctx.fillRect(10, -30, 20, 10);
                ctx.fillRect(-30, -30, 20, 10);
                ctx.restore();

                // Draw Magnetic Field Lines (Visual)
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 150, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(128, 40, 160, 0.1)'; // Purple tint
                ctx.fill();
            }

            // Update & Draw Metal Particles
            for(let i = entities.length-1; i>=0; i--) {
                const p = entities[i];
                if(p.type === 'metal') {
                    if(magnetActive) {
                        const dx = mouse.x - p.x;
                        const dy = mouse.y - p.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if(dist < 250 && dist > 20) {
                            // Attractive force (inverse square-ish)
                            const force = 500 / (dist * dist);
                            p.vx += (dx/dist) * force;
                            p.vy += (dy/dist) * force;
                        }
                    }
                    
                    // Friction
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                    
                    p.x += p.vx;
                    p.y += p.vy;

                    // Bounds
                    if(p.x < 0) p.x = 0; if(p.x > width) p.x = width;
                    if(p.y < 0) p.y = 0; if(p.y > height) p.y = height;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
                    ctx.fillStyle = '#94a3b8'; // Slate
                    ctx.fill();
                    ctx.stroke();
                }
            }
        }

        // ==========================================
        // LAB 4: FRICTION
        // ==========================================
        let surfaceType = 'wood'; // ice, wood, sand
        const frictionValues = { ice: 0.99, wood: 0.95, sand: 0.85 };
        let block = { x: 200, y: 0, vx: 0, w: 60, h: 40, isDragging: false, dragStartX: 0 };
        
        function setupFrictionContext() {
            contextControls.classList.remove('hidden');
            block.y = height/2 - block.h/2;
            block.x = width/4;
            
            ['ice', 'wood', 'sand'].forEach(type => {
                const b = document.createElement('button');
                b.className = `px-4 py-1 rounded-full font-bold uppercase text-sm border-2 border-black ${surfaceType===type ? 'bg-rkRed text-white' : 'bg-gray-200 text-gray-500'}`;
                b.innerText = type;
                b.onclick = () => { surfaceType = type; block.vx = 0; block.x = width/4; setupFrictionContext(); };
                contextControls.appendChild(b);
            });
        }
        function handleFriction(action) {
            if(action === 'down') {
                if(mouse.x > block.x - 50 && mouse.x < block.x + block.w + 50 &&
                   mouse.y > block.y - 50 && mouse.y < block.y + block.h + 50) {
                    block.isDragging = true;
                    block.dragStartX = mouse.x;
                    block.vx = 0;
                }
            }
            if(action === 'move' && block.isDragging) {
                // Only pull left
                if(mouse.x < width/4) block.x = mouse.x;
            }
            if(action === 'up' && block.isDragging) {
                block.isDragging = false;
                // Launch forward based on how far pulled back
                const pullDist = (width/4) - block.x;
                if(pullDist > 0) block.vx = pullDist * 0.3;
            }
        }
        function drawFriction() {
            // Draw Surface
            ctx.fillStyle = surfaceType === 'ice' ? '#bae6fd' : surfaceType === 'wood' ? '#d97706' : '#fde047';
            ctx.fillRect(0, height/2 + block.h/2, width, height);

            if(!block.isDragging) {
                block.x += block.vx;
                block.vx *= frictionValues[surfaceType]; // Apply specific friction
                if(Math.abs(block.vx) < 0.1) block.vx = 0;
            }

            // Draw Slingshot String
            if(block.isDragging) {
                ctx.beginPath();
                ctx.moveTo(width/4, height/2 - 20);
                ctx.lineTo(block.x, block.y + block.h/2);
                ctx.lineTo(width/4, height/2 + block.h + 20);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // Draw Block
            ctx.fillStyle = colors.orange;
            ctx.fillRect(block.x, block.y, block.w, block.h);
            ctx.strokeRect(block.x, block.y, block.w, block.h);
            
            // Speed indicator
            if(Math.abs(block.vx) > 0) {
                ctx.fillStyle = 'black';
                ctx.font = 'bold 16px Arial';
                ctx.fillText(`Speed: ${block.vx.toFixed(1)}`, block.x, block.y - 10);
            }
        }

        // ==========================================
        // LAB 5: CENTRIFUGAL FORCE
        // ==========================================
        let spinner = { angle: 0, radius: 100, speed: 0.1, cx: 0, cy: 0, isSpinning: false, released: false, x:0, y:0, vx:0, vy:0 };
        function initCentrifugal() {
            spinner.cx = width/2;
            spinner.cy = height/2;
            spinner.released = false;
            spinner.radius = 120;
            spinner.speed = 0.05;
            spinner.angle = 0;
        }
        function handleCentrifugal(action) {
            if(action === 'down') {
                if(spinner.released) initCentrifugal(); // reset
                spinner.isSpinning = true;
            }
            if(action === 'up' && spinner.isSpinning) {
                spinner.isSpinning = false;
                spinner.released = true;
                // Calculate tangential velocity
                spinner.vx = -Math.sin(spinner.angle) * (spinner.radius * spinner.speed);
                spinner.vy = Math.cos(spinner.angle) * (spinner.radius * spinner.speed);
            }
        }
        function drawCentrifugal() {
            spinner.cx = width/2;
            spinner.cy = height/2;

            // Draw center peg
            ctx.beginPath();
            ctx.arc(spinner.cx, spinner.cy, 10, 0, Math.PI*2);
            ctx.fillStyle = '#333';
            ctx.fill();

            if(!spinner.released) {
                if(spinner.isSpinning) {
                    spinner.speed += 0.002; // speed up while holding
                    if(spinner.speed > 0.3) spinner.speed = 0.3; // max speed
                } else {
                    spinner.speed *= 0.98; // slow down if not holding
                }
                spinner.angle += spinner.speed;
                spinner.x = spinner.cx + Math.cos(spinner.angle) * spinner.radius;
                spinner.y = spinner.cy + Math.sin(spinner.angle) * spinner.radius;

                // Draw String
                ctx.beginPath();
                ctx.moveTo(spinner.cx, spinner.cy);
                ctx.lineTo(spinner.x, spinner.y);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.stroke();
            } else {
                // Fly away!
                spinner.x += spinner.vx;
                spinner.y += spinner.vy;
            }

            // Draw Ball
            ctx.beginPath();
            ctx.arc(spinner.x, spinner.y, 25, 0, Math.PI*2);
            ctx.fillStyle = colors.green;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.stroke();

            // Force vector arrows
            if(!spinner.released && spinner.speed > 0.01) {
                ctx.strokeStyle = colors.red; // Centrifugal outward pull feeling
                ctx.beginPath();
                ctx.moveTo(spinner.x, spinner.y);
                ctx.lineTo(spinner.x + Math.cos(spinner.angle)*50, spinner.y + Math.sin(spinner.angle)*50);
                // Arrow head
                ctx.stroke();
            }
        }

        // ==========================================
        // LAB 6: GRAVITY
        // ==========================================
        function handleGravity(action) {
            if(action === 'down' || action === 'move') {
                if(mouse.isDown && Math.random() < 0.3) {
                    entities.push({
                        type: 'ball',
                        x: mouse.x, y: mouse.y,
                        vx: (Math.random()-0.5)*4, vy: 0,
                        radius: Math.random()*15 + 10,
                        color: Object.values(colors)[Math.floor(Math.random()*6)],
                        bounce: 0.7
                    });
                }
            }
        }
        function drawGravity() {
            for(let i = entities.length-1; i>=0; i--) {
                const b = entities[i];
                if(b.type === 'ball') {
                    b.vy += 0.5; // Gravity pull
                    b.x += b.vx;
                    b.y += b.vy;

                    // Floor bounce
                    if(b.y + b.radius > height) {
                        b.y = height - b.radius;
                        b.vy *= -b.bounce;
                        b.vx *= 0.98; // floor friction
                    }
                    // Wall bounce
                    if(b.x - b.radius < 0) { b.x = b.radius; b.vx *= -1; }
                    if(b.x + b.radius > width) { b.x = width - b.radius; b.vx *= -1; }

                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
                    ctx.fillStyle = b.color;
                    ctx.fill();
                    ctx.stroke();
                }
            }
        }

        // ==========================================
        // MAIN GAME LOOP
        // ==========================================
        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            if(currentLab === 'light') drawLight();
            if(currentLab === 'sound') drawSound();
            if(currentLab === 'magnet') drawMagnet();
            if(currentLab === 'friction') drawFriction();
            if(currentLab === 'centrifugal') drawCentrifugal();
            if(currentLab === 'gravity') drawGravity();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Initialization
        window.onload = () => {
            resizeCanvas();
            setLab('light');
            gameLoop();
        };

    </script>
</body>
</html>
